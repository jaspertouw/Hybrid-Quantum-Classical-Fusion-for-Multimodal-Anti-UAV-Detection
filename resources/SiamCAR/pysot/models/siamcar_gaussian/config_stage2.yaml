# Stage 2 Evidential head training — overrides for stream-specific config
# Merge order: cfg.merge_from_file(stream_config); cfg.merge_from_file(this)

TRAIN:
    EPOCH: 40
    BATCH_SIZE: 64
    BASE_LR: 0.0001
    GRAD_CLIP: 10.0

BACKBONE:
    TRAIN_EPOCH: 999  # disable built-in backbone unfreeze logic (entire network frozen)
