name: Fusion verification
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install numpy==2.0.2 opencv-python-headless==4.10.0.84 pytest==8.3.5
      - run: python -m pytest tests -q
  fusion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r environments/fusion_requirements.txt
      - run: PYTHONPATH=. python -m pytest tests/test_shared_fusion.py tests/test_neural_fusion.py tests/test_verification.py -q -W error
